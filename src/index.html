<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brewinget</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <header class="topbar" data-tauri-drag-region>
      <span class="logo"><img src="icon.png" class="topbar-icon" alt="" />Brewinget</span>
      <nav class="tabs">
        <button class="tab active" data-tab="search">Search</button>
        <button class="tab" data-tab="installed">Installed</button>
      </nav>
      <label class="toggle-label topbar-silent" title="Default state for per-app Silent checkboxes">
        <input type="checkbox" id="silent-default-toggle" />
        Silent installs
      </label>
      <div class="win-controls">
        <button class="win-btn win-minimize" title="Minimize">&#x2212;</button>
        <button class="win-btn win-maximize" title="Maximize / Restore">&#x25A1;</button>
        <button class="win-btn win-close"    title="Close">&#x2715;</button>
      </div>
    </header>

    <!-- Search Tab -->
    <section id="tab-search" class="tab-content active">

      <!-- Welcome state: visible before first search, centered -->
      <div id="search-welcome">
        <div class="search-welcome-logo">
          <img src="icon.png" class="welcome-icon" alt="" />
          <span>Brewinget</span>
        </div>
        <p class="search-welcome-tagline">Search winget and Microsoft Store</p>
        <div class="search-welcome-bar">
          <input id="search-input-welcome" type="text" placeholder="Search for a package…" autocomplete="off" />
          <button id="search-btn-welcome">Search</button>
        </div>
        <div class="quick-picks">
          <button class="quick-pick" data-query="Visual Studio Code">Visual Studio Code</button>
          <button class="quick-pick" data-query="Firefox">Firefox</button>
          <button class="quick-pick" data-query="Git.Git">Git</button>
          <button class="quick-pick" data-query="PowerShell">PowerShell</button>
        </div>
      </div>

      <!-- Compact state: visible after first search, top-aligned -->
      <div class="search-compact">
        <div class="search-bar">
          <input id="search-input" type="text" placeholder="Search for a package…" autocomplete="off" />
          <button id="search-btn">Search</button>
        </div>
        <div class="search-toolbar hidden" id="search-toolbar">
          <span id="search-status" class="status-msg"></span>
          <label class="toggle-label">
            <input type="checkbox" id="show-msstore-toggle" />
            Show Microsoft Store results
          </label>
        </div>
        <div id="results-grid" class="results-grid"></div>
      </div>

    </section>

    <!-- Installed Tab -->
    <section id="tab-installed" class="tab-content">
      <div class="installed-layout">

        <!-- Main content -->
        <div class="installed-main">
          <div class="section-header">
            <h2>Installed Packages</h2>
            <div class="section-actions">
              <button id="update-all-btn" class="btn-update-all hidden">Update All</button>
              <button id="refresh-btn">Refresh</button>
            </div>
          </div>
          <div class="installed-toolbar">
            <input id="installed-filter" type="text" placeholder="Filter packages…" autocomplete="off" />
            <label class="toggle-label">
              <input type="checkbox" id="show-arp-toggle" />
              Show all detected programs
            </label>
          </div>
          <div id="installed-status" class="status-msg"></div>
          <table id="installed-table" class="installed-table">
            <thead>
              <tr>
                <th data-sort="name">Package <span class="sort-ind"></span></th>
                <th data-sort="version">Version <span class="sort-ind"></span></th>
                <th data-sort="status">Status <span class="sort-ind"></span></th>
                <th>Actions</th>
                <th class="auto-update-th" title="Apps with auto-update enabled will be updated automatically when a scheduled task runs. Configure the schedule in Settings (coming in a future update).">Auto-update</th>
              </tr>
            </thead>
            <tbody id="installed-body"></tbody>
          </table>
        </div>

        <!-- Queue side panel — visible only while update-all is running -->
        <aside id="queue-panel" class="queue-panel hidden">
          <div class="queue-header">
            <div class="queue-title-block">
              <span class="queue-title">Updating packages</span>
              <span id="queue-progress" class="queue-progress">0 of 0</span>
            </div>
            <button id="abort-btn" class="btn-abort">Abort</button>
          </div>
          <ul id="queue-list" class="queue-list"></ul>
          <pre id="queue-log" class="queue-log"></pre>
        </aside>

      </div>
    </section>

  </div>

  <!-- Log modal -->
  <div id="log-backdrop" class="log-backdrop hidden">
    <div class="log-modal">
      <div class="log-header">
        <span id="log-title">Installing…</span>
        <button id="log-close" class="log-close" disabled>✕</button>
      </div>
      <pre id="log-output" class="log-output"></pre>
      <div id="log-footer" class="log-footer"></div>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
